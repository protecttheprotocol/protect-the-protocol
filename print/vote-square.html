<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Vote square</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="poster.css">
<style>
  /* Social square. Base 540 x 540 px, rendered at 2160 x 2160. */
  :root { --w: 540px; --h: 540px; --frame: 20px; }

  .paper { padding: 28px 28px 24px; gap: 14px; }
  .pp-sheet__head { font-size: 15px; border-bottom-width: 3px; padding-bottom: 8px; }
  h1 { margin: 10px 0 0; font-size: 64px; font-weight: 900; font-stretch: 62%; line-height: 0.88; letter-spacing: -0.01em; text-transform: uppercase; }
  .kicker { margin: 4px 0 0; max-width: 15em; font-size: 21px; line-height: 1.3; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 900; text-transform: uppercase; }
  .foot img { width: 30px; height: 30px; }
  .pp-sticker { width: 172px; right: 10px; bottom: 10px; transform: rotate(-8deg); }
</style>
</head>
<body>
<div class="poster">
  <div class="paper">
    <div class="pp-sheet__head"><span>Official ballot</span><span>Devcon · Mumbai</span></div>
    <h1>Vote <span class="pp-no">no</span> on<br>decentralization<br>theater.</h1>
    <p class="kicker serif">A permission that can be revoked is not freedom.</p>
    <div class="foot"><img src="../img/mark.svg" alt=""><span>Protect the Protocol<span class="pp-bang">!</span></span></div>
  </div>
  <img class="pp-sticker" src="../img/sticker.png" alt="I voted NO for Decentralization Theater">
</div>
</body>
</html>
